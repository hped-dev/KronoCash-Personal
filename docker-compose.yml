services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-kronocashpersonal
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    #   - "5877:5432" // descomentar sol,amente si ocupamos exponer la base de datos para usar algún lector
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kronocashpersonal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kronocash-app:
    build: .
    container_name: app-kronocashpersonal
    ports:
      - "7777:7777"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_FLYWAY_ENABLED=true
      - TZ=America/Mexico_City
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - kronocashpersonal-net

volumes:
  pgdata:

networks:
  kronocashpersonal-net:
    driver: bridge